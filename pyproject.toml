[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebook globals (spark, dbutils) are injected at runtime
"pipelines/*.py" = ["F821"]
"jobs/*.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
